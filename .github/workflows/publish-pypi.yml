# Publish kvtsjl to PyPI when a GitHub Release is published.
# Requires PyPI trusted publishing for mashin-io/kvtsjl + environment "pypi".
# Release tag must match __version__ in src/kvtsjl/__init__.py (e.g. 0.1.0).
# Bump with: python scripts/bump_version.py X.Y.Z

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Type check
        run: pyright src/kvtsjl

  release-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          VERSION=$(python -c "import re; from pathlib import Path; text=Path('src/kvtsjl/__init__.py').read_text(); print(re.search(r'^__version__ = \"([^\"]+)\"', text, re.M).group(1))")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG does not match __version__ $VERSION"
            exit 1
          fi

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/kvtsjl/${{ github.event.release.tag_name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
