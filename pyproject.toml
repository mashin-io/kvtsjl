[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvtsjl"
version = "0.1.0"
description = "A typed, composable Python facade for key-value storage. Decouples domain schemas from persistence backends with orthogonal scope partitioning and layered wrappers (fallback, mirror, tiering). Features an abstract multi-indexing layer—attach custom exact, sparse, dense, or semantic vector indices per store for unified search and hydration."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "Ahmed Mahran", email = "ahmed.mahran@mashin.io" },
]
keywords = [
  "kv",
  "key-value",
  "store",
  "cache",
  "indexing",
  "vector-search",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
redis = ["redis>=5"]
s3 = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2.14"]
all = [
  "kvtsjl[pydantic,redis,s3,gcs]",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pyright>=1.1",
  "fakeredis>=2.26",
  "moto[s3]>=5.0",
  "freezegun>=1.5",
  "boto3-stubs[s3]>=1.34",
  "kvtsjl[all]",
]

[project.urls]
Homepage = "https://github.com/mashin-io/kvtsjl"
Repository = "https://github.com/mashin-io/kvtsjl"
Issues = "https://github.com/mashin-io/kvtsjl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kvtsjl"]

[tool.hatch.build.targets.wheel.sources]
"src/kvtsjl" = "kvtsjl"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "s3: tests using moto-simulated S3",
  "redis: tests using fakeredis",
  "gcs: tests using an in-memory fake GCS bucket",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.pyright]
include = ["src/kvtsjl"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
# google-cloud-storage / some redis stubs leave Unknowns; keep value checks strict.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false
reportPrivateUsage = false
